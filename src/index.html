<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>EventPulse</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script>
      // Clean any legacy rogue service worker and browser cache
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
        }).catch(function() {});
      }
    </script>
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .splash-logo-box {
        width: 110px;
        height: 110px;
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 16px 40px -10px rgba(124, 58, 237, 0.45);
        margin-bottom: 1.5rem;
        animation: splashPulse 2.4s ease-in-out infinite;
      }
      .splash-logo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .splash-tagline {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #1e1b4b;
        letter-spacing: -0.01em;
        margin-bottom: 0.4rem;
      }
      .splash-sub {
        font-size: 0.85rem;
        font-weight: 600;
        color: #7c3aed;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 16px 40px -10px rgba(124, 58, 237, 0.45); }
        50% { transform: scale(1.04); box-shadow: 0 20px 50px -8px rgba(16, 185, 129, 0.4); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="initial-splash">
        <div class="splash-logo-box">
          <img src="/logo.jpg" alt="EventPulse" />
        </div>
        <div class="splash-sub">⚡ EventPulse Campus Pass</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
